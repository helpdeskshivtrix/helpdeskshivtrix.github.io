<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShivTrix</title>
<link rel="icon" href="shivtrix-logo.png" type="image/png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#fff;
    background:radial-gradient(circle at 20% 10%,#12306b,#070d24 70%)}
  .card{text-align:center;padding:40px 32px;border-radius:24px;max-width:420px;width:90%;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  img{width:200px;max-width:70%;height:auto}
  h1{margin:16px 0 4px;background:linear-gradient(90deg,#3b82f6,#06b6d4);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0;color:#fbbf24}
</style>
</head>
<body>
  <div class="card">
    <img src="shivtrix-logo.png" alt="ShivTrix logo">
    <h1>ShivTrix</h1>
    <p>Help Desk</p>
  </div>
</body>
</html>
